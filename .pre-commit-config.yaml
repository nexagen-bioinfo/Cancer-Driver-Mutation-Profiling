# Run `pre-commit install` once, then every commit is checked locally with the
# same rules that continuous integration enforces.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch=main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: ["pandas-stubs", "types-PyYAML", "types-requests"]
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        description: Keep notebook diffs reviewable by stripping outputs before commit.

  - repo: https://github.com/snakemake/snakefmt
    rev: v0.10.2
    hooks:
      - id: snakefmt

  - repo: local
    hooks:
      - id: no-data-in-git
        name: block accidental data commits
        entry: bash -c 'git diff --cached --name-only | grep -E "^(data|results)/(raw|interim|processed|external|tables|figures|models)/" && echo "Data files must not be committed. Register them in config/checksums/manifest.sha256 instead." && exit 1 || exit 0'
        language: system
        pass_filenames: false
