# ==============================================================================
# SCURATOR: Somatic Driver Mutation Profiling Framework
# Git Pre-Commit Hook Configuration (.pre-commit-config.yaml)
#
# Standards Compliance:
# * European Open Science Cloud (EOSC) FAIR Principles (Findable, Accessible, Interoperable, Reusable)
# * Google Open Source Software (OSS) Engineering Practice Standards
# * European Union Public Licence v1.2 (EUPL-1.2)
# ==============================================================================

default_language_version:
  python: python3.10

default_stages: [commit, push]

repos:
  # ------------------------------------------------------------------------------
  # 1. Standard Pre-Commit Sanity and Security Checks
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements

  # ------------------------------------------------------------------------------
  # 2. Python Code Formatter (Black)
  # ------------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10

  # ------------------------------------------------------------------------------
  # 3. Python Import Sorter (isort)
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # ------------------------------------------------------------------------------
  # 4. Fast Linter and Code Quality Engine (Ruff)
  # ------------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # ------------------------------------------------------------------------------
  # 5. Static Type Checker (Mypy)
  # ------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - types-setuptools
          - pandas-stubs
        args: [--ignore-missing-imports, --warn-unreachable]
