# ==============================================================================
# SCURATOR: Somatic Driver Mutation Profiling Framework
# Environment Specification File (Conda / Mamba)
#
# Standards Compliance:
# * European Open Science Cloud (EOSC) FAIR Principles (Findable, Accessible, Interoperable, Reusable)
# * Google Open Source Software (OSS) Engineering Practice Standards
# * European Union Public Licence v1.2 (EUPL-1.2)
# ==============================================================================

name: scurator
channels:
  - conda-forge
  - bioconda
  - nvidia
  - defaults

dependencies:
  # Core Runtime and Language Specification
  - python=3.10
  - pip>=23.2.1
  - setuptools>=61.0.0
  - wheel>=0.41.0

  # Native C/C++ Build Tooling for High-Performance C-Extensions
  - gcc_linux-64>=12.0.0
  - gxx_linux-64>=12.0.0
  - make>=4.3

  # High-Performance Bioinformatics Stack (Bioconda Channel)
  - biopython>=1.81
  - pysam>=0.21.0
  - cyvcf2>=0.30.22
  - samtools>=1.17
  - bcftools>=1.17
  - htslib>=1.17
  - snakemake-minimal>=7.30.0

  # Numerical Computing and Data Engineering (Conda-Forge Channel)
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - pyyaml>=6.0
  - click>=8.1.0
  - tqdm>=4.65.0
  - requests>=2.31.0
  - openpyxl>=3.1.0

  # Academic Publication Graphics Engine (300 DPI Rendering)
  - matplotlib-base>=3.7.0
  - seaborn>=0.12.0
  - pillow>=10.0.0

  # Quality Assurance, Automated Testing, and Static Code Analysis
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  - black>=23.7.0
  - isort>=5.12.0
  - flake8>=6.1.0
  - mypy>=1.5.0
  - ruff>=0.0.280
  - pre-commit>=3.3.3

  # GPU Hardware Acceleration Drivers for Dual NVIDIA T4 Setup
  - cudatoolkit=11.8

  # PyPI Native Extensions and Local Package Linkage
  - pip:
      - cudf-cu11>=23.08.0; platform_system == "Linux"
      - cupy-cuda11x>=12.0.0; platform_system == "Linux"
      - -e .

variables:
  PYTHONPATH: ./src
  PYTHONWARNINGS: ignore::DeprecationWarning
  CUDA_VISIBLE_DEVICES: "0,1"
