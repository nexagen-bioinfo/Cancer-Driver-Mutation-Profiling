# ==============================================================================
# SCURATOR: Somatic Driver Mutation Profiling Framework
# System Logging Configuration Specification (config/logging.yaml)
#
# Standards Compliance:
# * European Open Science Cloud (EOSC) FAIR Principles (Findable, Accessible, Interoperable, Reusable)
# * Google Open Source Software (OSS) Observability and Logging Standards
# * Python logging.config Standard Specification (PEP 282 / dictConfig)
# * European Union Public Licence v1.2 (EUPL-1.2)
# ==============================================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s [%(levelname)s] [pid:%(process)d] [thread:%(threadName)s] %(name)s.%(funcName)s:%(lineno)d: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  benchmark:
    format: "%(asctime)s [BENCHMARK] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "module": "%(module)s", "line": %(lineno)d, "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%SZ"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_info:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: "logs/scurator.log"
    maxBytes: 10485760 # 10 Megabytes
    backupCount: 5
    encoding: "utf-8"

  file_error:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: "logs/scurator_error.log"
    maxBytes: 10485760 # 10 Megabytes
    backupCount: 5
    encoding: "utf-8"

  benchmark_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: benchmark
    filename: "logs/benchmarks.log"
    maxBytes: 10485760 # 10 Megabytes
    backupCount: 3
    encoding: "utf-8"

loggers:
  scurator:
    level: INFO
    handlers: [console, file_info, file_error]
    propagate: false

  scurator.data:
    level: INFO
    handlers: [console, file_info]
    propagate: false

  scurator.pipeline:
    level: INFO
    handlers: [console, file_info]
    propagate: false

  scurator.utils.gpu_accelerator:
    level: INFO
    handlers: [console, benchmark_file]
    propagate: false

  scurator.visualization:
    level: INFO
    handlers: [console, file_info]
    propagate: false

root:
  level: WARNING
  handlers: [console, file_error]
