[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmp"
version = "0.1.0"
description = "Calibrated, leakage-controlled cancer driver mutation profiling from tumour sequencing data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "EUPL-1.2" }
authors = [{ name = "NEXAGEN Bioinformatics" }]
keywords = [
  "cancer genomics",
  "driver mutations",
  "somatic variants",
  "variant effect prediction",
  "reproducible research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "requests>=2.31",
  "biopython>=1.83",
]

[project.optional-dependencies]
vcf = ["cyvcf2>=0.30", "pysam>=0.22"]
plm = ["torch>=2.1", "fair-esm>=2.0.0"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
  "pre-commit>=3.6",
  "snakemake>=8.0",
  "nbstripout>=0.7",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling"
Repository = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling"
Documentation = "https://nexagen-bioinfo.github.io/Cancer-Driver-Mutation-Profiling/"
Issues = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling/issues"

[project.scripts]
cdmp = "cdmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdmp = ["py.typed", "resources/*.tsv", "resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=cdmp --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "slow: tests that take more than a few seconds",
  "gpu: tests that require a CUDA device",
  "network: tests that require network access",
]

[tool.mypy]
python_version = "3.10"
files = ["src/cdmp"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cdmp"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 70
