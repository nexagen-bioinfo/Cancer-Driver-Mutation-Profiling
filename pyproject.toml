# ==============================================================================
# SCURATOR: Somatic Driver Mutation Profiling Framework
# Python Project Specification File (PEP 517 / PEP 518 / PEP 621)
#
# Standards Compliance:
# * European Open Science Cloud (EOSC) FAIR Principles (Findable, Accessible, Interoperable, Reusable)
# * Google Open Source Software (OSS) Engineering Practice Standards
# * European Union Public Licence v1.2 (EUPL-1.2)
# ==============================================================================

[build-system]
requires = ["setuptools>=61.0.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scurator"
version = "1.0.0"
description = "High-performance, GPU-accelerated somatic driver mutation profiling and functional impact assessment framework for cancer genomics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "EUPL-1.2" }
keywords = [
    "cancer-genomics",
    "bioinformatics",
    "driver-mutations",
    "variant-annotation",
    "vcf-processing",
    "somatic-variants",
    "gpu-acceleration",
    "rapids-cudf",
    "tcga",
    "clinvar",
    "cosmic",
    "ngs-analysis",
]
authors = [
    { name = "NEXAGEN Research Team", email = "research@nexagen.org" }
]
maintainers = [
    { name = "NEXAGEN Scientific Community", email = "dev@nexagen.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "biopython>=1.81",
    "pysam>=0.21.0",
    "cyvcf2>=0.30.22",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
gpu = [
    "cudf-cu11>=23.08.0; platform_system == 'Linux'",
    "cupy-cuda11x>=12.0.0; platform_system == 'Linux'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "ruff>=0.0.280",
    "pre-commit>=3.3.3",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
all = [
    "scurator[gpu,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling"
Documentation = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling/tree/main/docs"
Repository = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling.git"
Issues = "https://github.com/nexagen-bioinfo/Cancer-Driver-Mutation-Profiling/issues"

[project.scripts]
scurator = "scurator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scurator = ["py.typed", "config/*.yaml", "config/*.json"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=scurator --cov-report=term-missing --cov-report=xml"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

[tool.coverage.run]
source = ["src/scurator"]
branch = true
omit = [
    "tests/*",
    "src/scurator/__version__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["E501"]
